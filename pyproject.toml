[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-agents-cli"
version = "0.1.0"
description = "Run Claude Code, Codex, Cursor and Gemini CLI on the same repo without them overwriting each other."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Muhammadaliyev", email = "viltrumlik@gmail.com" }]
keywords = [
    "claude-code", "codex", "cursor", "gemini-cli",
    "multi-agent", "coordination", "file-locking", "agent-skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
# Ataylab bo'sh: pa.py hech narsaga bog'liq emas va shunday qolishi kerak.
dependencies = []

[project.urls]
Homepage = "https://github.com/Viltrumlik/parallel-agents"
Source = "https://github.com/Viltrumlik/parallel-agents"
Issues = "https://github.com/Viltrumlik/parallel-agents/issues"
Changelog = "https://github.com/Viltrumlik/parallel-agents/blob/main/CHANGELOG.md"

[project.scripts]
# main() exit kodini qaytaradi, console_scripts uni to'g'ridan-to'g'ri ishlatadi.
pa = "pa:main"

[tool.setuptools]
# Skill tuzilishi o'zgarmaydi -- skills CLI unga tayanadi. Paket shunchaki
# o'sha papkadan ikki modulni oladi.
py-modules = ["pa", "pa_hook"]

[tool.setuptools.package-dir]
"" = "skills/parallel-agents/scripts"
